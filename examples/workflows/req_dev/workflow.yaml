name: req_dev
label: "需求开发"
description: "需求驱动开发流程（P1：design → review → develop → code_review → submit_pr）；await_review/fix_revision 在 P3 加入"
setup_func: setup_req_dev_task

# 每个 phase 就地内联 agent 配置（不再引用命名 agent）。
phases:
  - name: design
    label: "设计"
    timeout: 900
    agent:
      label: "架构师"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
  - name: review
    label: "设计评审"
    timeout: 900
    reject: design
    max_rejections: 10
    agent:
      label: "评审员"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
      max_turns: 5
      system_prompt: "你是代码审查员。关注正确性、可读性、边界与失败处理。找出真问题而非格式纠错；按 critical / important / minor 分级反馈。"
  - name: develop
    label: "开发"
    timeout: 1800
    agent:
      label: "开发者"
      provider: anthropic
      model: claude-opus-4-6
      permission_mode: bypassPermissions
  - name: code_review
    label: "代码评审"
    timeout: 1200
    reject: develop
    max_rejections: 10
    agent:
      label: "评审员"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
      max_turns: 5
      system_prompt: "你是代码审查员。关注正确性、可读性、边界与失败处理。找出真问题而非格式纠错；按 critical / important / minor 分级反馈。"
  - name: submit_pr
    label: "提交 PR"
    timeout: 300
    # run_submit_pr 用 agent 生成 PR 描述，沿用评审员配置
    agent:
      label: "评审员"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
      max_turns: 5
      system_prompt: "你是代码审查员。关注正确性、可读性、边界与失败处理。找出真问题而非格式纠错；按 critical / important / minor 分级反馈。"
  # await_review：长挂起态，靠外部 trigger 推进（无 agent）
  # - revision_request: reviewer 反馈到达 → 跳到 fix_revision
  # - 直接 forceTransition 到 done（gh poller 在 P4 实现）
  - name: await_review
    label: "等待评审"
    timeout: 2592000
    jump_trigger: revision_request
    jump_target: fix_revision

  # fix_revision：独立阶段，agent 读 feedback + checkout PR 分支 + 修复 + push
  # 完成后 jump 回 await_review 等下一轮
  - name: fix_revision
    label: "修复评审意见"
    timeout: 1800
    jump_trigger: fix_done
    jump_target: await_review
    max_rejections: 30
    agent:
      label: "开发者"
      provider: anthropic
      model: claude-opus-4-6
      permission_mode: bypassPermissions
