name: review_loop
template_revision: 2   # 模板修订号；examples 改了 bug fix 就 +1，老副本据此被提示同步
label: 评审回路示例
description: 最小声明式判据示例——设计 → 评审（agent 判 PASS/REJECT）→ 通过即完成、驳回则回设计重做。全 prompt 模式、零 ts。展示 decision / ${HANDOFF} / ${REJECTION} 三件套，可克隆改造，也可忽略。
requires: { git: false }
# 不声明 delivers：本流是纯决策回路演示，方案以 handoff 文本产出，不交付文件产物（若要产文件，
# 加 produce 阶段写 ${DELIVERABLES} + deliver: artifacts 收口，并声明顶层 delivers: artifacts）。
phases:
  - name: design
    timeout: 600
    handoff: true
    prompt: |
      你是方案设计者。根据下面的需求，输出一份简短但完整的技术方案。

      ## 需求
      ${REQUIREMENT}

      ${REJECTION}

      要求：直接把方案正文写在你的回复里（系统会自动保存，无需你写文件）。
      不要去读取、诊断或修改任何文件，也不要谈论文件路径或运行环境——只管输出方案内容本身。
  - name: review
    timeout: 600
    reject: design
    max_rejections: 3
    prompt: |
      你是技术评审。只依据下面「待评审方案」的文本内容判断它是否满足需求，不要去读任何文件。

      ## 需求
      ${REQUIREMENT}

      ## 待评审方案
      ${HANDOFF_design}

      最后必须独占一行输出 REVIEW_RESULT: PASS 或 REVIEW_RESULT: REJECT。
      若驳回，在 "## 驳回理由" 标题下写明问题。方案只要覆盖了需求要点即可通过，不必吹毛求疵。
    decision:
      pass: "REVIEW_RESULT: PASS"
      reject: "REVIEW_RESULT: REJECT"
      reason_section: "## 驳回理由"
