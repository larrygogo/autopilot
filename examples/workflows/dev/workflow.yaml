name: dev
label: "完整开发"
description: "完整开发流程（设计 → 评审 → 开发 → 代码审查 → PR）"
setup_func: setup_dev_task

config:
  repo_path: ~/repos/my-project
  default_branch: main

# 每个 phase 就地内联 agent 配置（不再引用命名 agent）。
# 省略 agent: 的 phase 走 DEFAULT_AGENT 兜底。
phases:
  - name: design
    label: "设计"
    timeout: 900
    agent:
      label: "架构师"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
  - name: review
    label: "设计评审"
    timeout: 900
    reject: design
    max_rejections: 3
    agent:
      label: "评审员"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
      max_turns: 5
      system_prompt: "你是代码审查员。关注正确性、可读性、边界与失败处理。找出真问题而非格式纠错；按 critical / important / minor 分级反馈。"
  - name: develop
    label: "开发"
    timeout: 1800
    agent:
      label: "开发者"
      provider: anthropic
      model: claude-opus-4-6
      permission_mode: bypassPermissions
  - name: code_review
    label: "代码评审"
    timeout: 1200
    reject: develop
    max_rejections: 3
    agent:
      label: "评审员"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
      max_turns: 5
      system_prompt: "你是代码审查员。关注正确性、可读性、边界与失败处理。找出真问题而非格式纠错；按 critical / important / minor 分级反馈。"
  - name: submit_pr
    label: "提交 PR"
    timeout: 300
    # run_submit_pr 用 agent 生成 PR 描述，沿用评审员配置
    agent:
      label: "评审员"
      provider: anthropic
      model: claude-sonnet-4-6
      permission_mode: bypassPermissions
      max_turns: 5
      system_prompt: "你是代码审查员。关注正确性、可读性、边界与失败处理。找出真问题而非格式纠错；按 critical / important / minor 分级反馈。"
