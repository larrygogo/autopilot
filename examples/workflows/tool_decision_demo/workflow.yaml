name: tool_decision_demo
label: 工具裁决示例（decision mode:tool）
description: |
  展示 decision mode:tool——做 review 的 agent **自己**出裁决：能用 MCP 工具的 provider
  （claude CLI）调 submit_decision(verdict, reason)；其余 provider 自动降级到等价的「输出 JSON
  裁决块」文本契约。框架只读 + 驱动状态机，不另起裁判 LLM（比 judge 更彻底，决策归 agent/用户）。
  设计 → 评审（tool 判）→ 通过即完成 / 驳回回设计重做。全 prompt 模式、零 ts，可克隆改造。
requires: { git: false }
phases:
  - name: design
    timeout: 600
    handoff: true
    prompt: |
      你是方案设计者。根据下面的需求，输出一份简短但完整的技术方案。

      ## 需求
      ${REQUIREMENT}

      ${REJECTION}

      直接把方案正文写在你的回复里（系统会自动保存，无需写文件）。
      不要读取、诊断或修改任何文件，也不要谈论文件路径或运行环境——只输出方案内容本身。
  - name: review
    timeout: 600
    reject: design
    max_rejections: 3
    prompt: |
      你是技术评审。只依据下面「待评审方案」的文本判断它是否满足需求，不要读任何文件。

      ## 需求
      ${REQUIREMENT}

      ## 待评审方案
      ${HANDOFF_design}

      ## 判据
      方案覆盖了需求要点即可通过，不必吹毛求疵；明显缺失或跑题才驳回。

      判完后提交你的裁决（pass 通过 / reject 驳回，reject 必须说明问题与改进方向）。
    decision:
      mode: tool
      criteria: 方案覆盖了需求要点即通过；明显缺失或跑题则驳回。
