name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本一致性闸门：tag 名（去 v）必须 == package.json version（版本号单一真相源），
      # 且 CHANGELOG 有对应版本段。不一致就 fail，挡在建 Release 之前，避免版本漂移。
      - name: Verify version consistency (tag == package.json == CHANGELOG)
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION  package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json version $PKG_VERSION 不一致——发版前请先把 package.json 改成 $TAG_VERSION（它是版本号单一真相源）。"
            exit 1
          fi
          if ! grep -qE "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 ## [$TAG_VERSION] 段——发版前请补上该版本的变更说明。"
            exit 1
          fi
          echo "✓ 版本一致：tag / package.json / CHANGELOG 三处对齐 v$TAG_VERSION"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Run tests
        run: bun run test

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Extract the section for this version from CHANGELOG.md
          awk '/^## \['"$VERSION"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > release_notes.md
          # If no notes found, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
